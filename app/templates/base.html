<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HBV-HCC Predictor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ url_for('landing') }}" class="brand">HBV-HCC Predictor</a>
    <nav>
      <a href="{{ url_for('landing') }}">Home</a>
      <a href="/predict">Predict</a>
      <a href="/about">About</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div class="probe-strip" aria-hidden="true">
    {% for i in range(71) %}
      <div class="tick"></div>
    {% endfor %}
  </div>

  <footer class="site-footer">
    HBV-HCC Early Prediction, Ophelia Awo Ayisi
  </footer>
</body>
</html>
