{% extends "base.html" %}

{% block title %}HBV-HCC Predictor — Predict{% endblock %}

{% block content %}
<section class="predict-page">
  <h1>Submit Gene Expression Data</h1>
  <p class="page-sub">
    Upload a CSV file containing normalized expression values for the 71 selected probes.
  </p>

  <form action="/predict" method="POST" enctype="multipart/form-data">

    <div class="input-panel active">
      <label for="csv-file">CSV file (71 columns, one row per sample)</label>
      <input type="file" id="csv-file" name="csv_file" accept=".csv">
    </div>

    <div class="sample-data-row">
      <span class="sample-note">Don't have a file handy?</span>
      <button type="button" id="load-sample" class="link-btn">Load Sample Data</button>
    </div>

    <button type="submit" class="cta">Run Prediction</button>
  </form>
</section>

<script>
  document.getElementById('load-sample').addEventListener('click', async () => {
    const response = await fetch('/static-sample');
    const blob = await response.blob();
    const file = new File([blob], 'sample_input.csv', { type: 'text/csv' });

    const dataTransfer = new DataTransfer();
    dataTransfer.items.add(file);
    document.getElementById('csv-file').files = dataTransfer.files;

    alert('Sample data loaded. Click "Run Prediction" to continue.');
  });
</script>
{% endblock %}
